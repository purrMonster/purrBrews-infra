services:
  nextcloud:
    # -apache variant -- confirmed 2026-09-03 via Nextcloud's own DockerHub
    # page as "a full Nextcloud installation including an apache web
    # server... designed to be easy to use and gets you running pretty
    # fast", the simpler standalone choice over -fpm (which needs a
    # separate webserver in front of it). 34 is the current stable major.
    image: nextcloud:34-apache
    container_name: nextcloud
    environment:
      TZ: ${TZ}
      NEXTCLOUD_ADMIN_USER: barista
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      # Space-separated, per Nextcloud's own docs. PERCOLATOR_LAN_IP so the
      # LAN IP itself works during setup; the real hostname gets added
      # once percolator's own Traefik + split-horizon DNS are wired up
      # (not done yet -- see traefik/ README notes).
      # Added nextcloud.${DOMAIN} 2026-09-05 alongside wiring this up to
      # Traefik (see labels: below) -- Nextcloud rejects requests whose
      # Host header isn't in this space-separated list, confirmed via its
      # own admin docs. Kept PERCOLATOR_LAN_IP too so direct-IP access
      # (bypassing Traefik entirely) still works if ever needed.
      NEXTCLOUD_TRUSTED_DOMAINS: ${PERCOLATOR_LAN_IP} nextcloud.${DOMAIN}
      # Confirmed exact names 2026-09-03 via Nextcloud's own DockerHub docs
      # -- discrete vars, not a URL.
      POSTGRES_HOST: postgres-nextcloud
      POSTGRES_DB: ${NEXTCLOUD_DB_DATABASE_NAME}
      POSTGRES_USER: ${NEXTCLOUD_DB_USERNAME}
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      # No Valkey-specific var exists -- confirmed Nextcloud points at
      # Valkey via these same Redis-named vars, since Valkey is wire-
      # compatible. DB 2 on ../valkey's shared instance -- reserved for
      # this in that compose file's own comment when it was built.
      REDIS_HOST: valkey
      REDIS_HOST_PORT: "6379"
    volumes:
      - /srv/data/nextcloud:/var/www/html
    # Still needs percolator_net -- NOT for postgres-nextcloud anymore
    # (that's colocated below, reached over this file's own default
    # project network), only to reach ../valkey/docker-compose.yml's
    # shared instance, which is a separate compose project on the same
    # host. See postgres-nextcloud's own comment below for why the
    # database side of this dropped percolator_net entirely, 2026-09-05.
    networks:
      - percolator_net
    depends_on:
      postgres-nextcloud:
        condition: service_healthy
    # Routed through percolator's own Traefik as of 2026-09-05 -- no
    # Authelia middleware here deliberately, at least for now: Nextcloud
    # already has its own login, and testing DNS-01 cert issuance on
    # percolator for the first time is easier to diagnose without also
    # debugging the ForwardAuth hop in the same test. Revisit adding
    # `traefik.http.routers.nextcloud.middlewares=authelia@file` later as
    # a deliberate defense-in-depth call, not an oversight if it's absent.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextcloud.rule=Host(`nextcloud.${DOMAIN}`)"
      - "traefik.http.routers.nextcloud.entrypoints=websecure"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=80"
    restart: unless-stopped
    # Known gap, STILL not fixed here even though Traefik is now actually
    # routing to this (2026-09-05): `trusted_proxies`/`overwriteprotocol`/
    # `overwritehost` (config.php keys, not env vars) still can't be set
    # via compose -- config.php doesn't exist until after Nextcloud's own
    # first-run install wizard completes. Do the install first (via
    # nextcloud.${DOMAIN} through Traefik, or a temporary direct port --
    # see this stack's README), THEN add those three keys to
    # /srv/data/nextcloud/config/config.php, or expect redirect loops /
    # "untrusted proxy" errors on every request that comes through Traefik.

  postgres-nextcloud:
    # Colocated here as of 2026-09-05, moved out of the old shared
    # ../postgres/docker-compose.yml (deleted) -- see the runbook's
    # 2026-09-05 entry: that file's 4-instances-in-one layout caused a
    # real port collision between two unrelated apps' databases
    # (postgres-immich and postgres-homeassistant), so every app on this
    # fleet now gets its own dedicated db layer in its own folder instead,
    # so a mistake made on one app's database config can't reach into an
    # unrelated app's.
    image: postgres:16
    container_name: postgres-nextcloud
    environment:
      POSTGRES_USER: ${NEXTCLOUD_DB_USERNAME}
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      POSTGRES_DB: ${NEXTCLOUD_DB_DATABASE_NAME}
    volumes:
      - /srv/data/postgres-nextcloud:/var/lib/postgresql/data
    # No networks: block -- colocated with nextcloud in this same compose
    # file/project, so it reaches (and is reached by) nextcloud over the
    # default project network without needing percolator_net at all.
    # Fully private to this file -- nothing outside it, including valkey
    # or any other app on percolator, can reach this database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NEXTCLOUD_DB_USERNAME} -d ${NEXTCLOUD_DB_DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  # Only still needed here for nextcloud (the app) to reach ../valkey's
  # shared instance -- see nextcloud's own comment above. Created
  # idempotently by ../compose.sh before this file is ever handed to
  # `docker compose` -- see that script's own comment.
  percolator_net:
    external: true
