services:
  scrutiny-collector:
    # Collector-only image, NOT the omnibus one silo runs -- Scrutiny's
    # own documented "hub and spoke" pattern, see
    # stacks/cellar/scrutiny-collector/docker-compose.yml's identical
    # copy of this file for the full explanation (that one was built
    # first; this one was almost forgotten entirely -- sieve is a
    # separate physical host with its own real disk, same as cellar/
    # percolator/mochaPot, silo being the hub doesn't make it special
    # among the *other* nodes). Version pinned to match silo's own
    # omnibus tag (v0.9.3) -- confirm this exact tag exists on GHCR
    # before first pull.
    image: ghcr.io/analogj/scrutiny:v0.9.3-collector
    container_name: scrutiny-collector
    cap_add:
      - SYS_RAWIO   # smartctl access for SATA/SAS drives
      - SYS_ADMIN   # smartctl access for NVMe drives
    environment:
      # Pushes to silo's omnibus container's API, over the LAN -- requires
      # silo's scrutiny service to republish port 8080 (done 2026-09-05,
      # see that compose file's own comment for the tradeoff). Note this
      # is a genuine cross-host call even though sieve and silo are both
      # "gateway-tier" nodes -- Docker networks still don't span hosts.
      COLLECTOR_API_ENDPOINT: http://${SILO_LAN_IP}:8080
      # Added 2026-09-05, found the hard way right after first bring-up:
      # by default this image ONLY collects on its cron schedule
      # (COLLECTOR_CRON_SCHEDULE, default midnight) -- it does NOT run
      # once immediately on container start. Without this, "the
      # container is up" and "silo's Scrutiny UI actually shows this
      # host's disks" are two different, unrelated facts, and the gap
      # between them is up to 24 hours with zero indication anything's
      # wrong. COLLECTOR_RUN_STARTUP=true forces an immediate run on
      # every container start/recreate, so `up -d` alone is enough to
      # verify this actually works, not just that it's scheduled to
      # eventually.
      COLLECTOR_RUN_STARTUP: "true"
    volumes:
      - /run/udev:/run/udev:ro
    devices:
      # sieve has ONE physical disk per initiation.txt (256GB NVMe) --
      # confirm the REAL device path on sieve itself before first
      # bring-up:
      #   lsblk -d -o NAME,TYPE,SIZE,MODEL
      # Use the controller node (/dev/nvme0), NOT the namespace block
      # device (/dev/nvme0n1).
      - ${SIEVE_DISK_DEVICE_NVME}
    restart: unless-stopped
    # No web UI, no port to publish -- this container only ever makes
    # outbound requests to silo.
