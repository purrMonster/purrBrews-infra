services:
  paperless:
    # Confirmed 2026-09-03 via paperless-ngx's own GHCR package page and
    # its reference docker/compose/docker-compose.postgres.yml. Pinned to
    # the current stable release, not :latest.
    image: ghcr.io/paperless-ngx/paperless-ngx:3.0.5
    container_name: paperless
    environment:
      TZ: ${TZ}
      # Discrete host/port/user/pass/name vars -- confirmed exact names
      # 2026-09-03 via paperless-ngx's own docs/configuration.md, NOT a
      # single DB URL the way some apps in this fleet use.
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: postgres-paperless
      PAPERLESS_DBPORT: "5432"
      PAPERLESS_DBNAME: ${PAPERLESS_DB_DATABASE_NAME}
      PAPERLESS_DBUSER: ${PAPERLESS_DB_USERNAME}
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD}
      # One URL-format var, confirmed -- DB 1 on ../valkey's shared
      # instance, reserved for paperless when that file was built.
      PAPERLESS_REDIS: redis://valkey:6379/1
      # Env-var-driven admin creation -- confirmed no manage.py step
      # needed, unlike some other apps in this fleet.
      PAPERLESS_ADMIN_USER: barista
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD}
      # Django's SECRET_KEY, generated once and pinned rather than left to
      # auto-generate -- same reasoning as n8n's N8N_ENCRYPTION_KEY on
      # mochaPot: a value that changes across container recreations would
      # invalidate existing sessions/signed data.
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      # CSRF-trusted-origin -- updated 2026-09-05 to the real hostname
      # now that Traefik actually routes here (see labels: below).
      # Paperless-ngx's own docs confirm this is a single URL, not a
      # list -- direct LAN-IP:8000 access was never published as a port
      # anyway, so there's no second origin worth also trusting.
      PAPERLESS_URL: https://paperless.${DOMAIN}
    volumes:
      - /srv/data/paperless/data:/usr/src/paperless/data
      - /srv/data/paperless/media:/usr/src/paperless/media
      - /srv/data/paperless/export:/usr/src/paperless/export
      - /srv/data/paperless/consume:/usr/src/paperless/consume
    # Still needs percolator_net -- NOT for postgres-paperless anymore
    # (that's colocated below, reached over this file's own default
    # project network), only to reach ../valkey/docker-compose.yml's
    # shared instance, a separate compose project on the same host. See
    # postgres-paperless's own comment below for why the database side of
    # this dropped percolator_net entirely, 2026-09-05.
    networks:
      - percolator_net
    depends_on:
      postgres-paperless:
        condition: service_healthy
    # Routed through percolator's own Traefik as of 2026-09-05 -- no
    # Authelia middleware here deliberately, at least for now: same
    # reasoning as nextcloud's own copy of this comment. Paperless-ngx's
    # container listens on 8000 internally (its own default, confirmed
    # via its reference compose), never published as a host port.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.paperless.rule=Host(`paperless.${DOMAIN}`)"
      - "traefik.http.routers.paperless.entrypoints=websecure"
      - "traefik.http.services.paperless.loadbalancer.server.port=8000"
    restart: unless-stopped
    # Known gaps, not fixed here (2026-09-03):
    # - gotenberg/tika (document format conversion + text extraction for
    #   non-PDF office formats) are in paperless-ngx's own reference
    #   compose as separate services -- not included here yet, only
    #   researched as existing, not actually configured. PDF-only
    #   consumption works without them.
    # - OCR languages beyond English need the corresponding tesseract-ocr
    #   language packs, which aren't all bundled in this base image --
    #   confirmed via paperless-ngx's own docs, needs a custom image layer
    #   or the -languages image variant if non-English OCR is needed.
    # - Consumption-dir polling: /srv/data/paperless/consume is on
    #   percolator's own local NVMe, not a network mount, so inotify
    #   (the default) should work fine -- PAPERLESS_CONSUMER_POLLING_INTERVAL
    #   only matters if that ever changes to a network-backed path.

  postgres-paperless:
    # Colocated here as of 2026-09-05, moved out of the old shared
    # ../postgres/docker-compose.yml (deleted) -- see the runbook's
    # 2026-09-05 entry: that file's 4-instances-in-one layout caused a
    # real port collision between two unrelated apps' databases
    # (postgres-immich and postgres-homeassistant), so every app on this
    # fleet now gets its own dedicated db layer in its own folder instead,
    # so a mistake made on one app's database config can't reach into an
    # unrelated app's.
    #
    # Paperless-ngx's own official reference compose
    # (docker/compose/docker-compose.postgres.yml) uses postgres:18 --
    # matched here rather than defaulting to 16, since this is the
    # specific version their own maintainers test against for a fresh
    # deploy. Each app's own Postgres version choice is independent, they
    # don't share a server.
    image: postgres:18
    container_name: postgres-paperless
    environment:
      POSTGRES_USER: ${PAPERLESS_DB_USERNAME}
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD}
      POSTGRES_DB: ${PAPERLESS_DB_DATABASE_NAME}
    # Mounted at the PARENT dir, /var/lib/postgresql, NOT .../data --
    # postgres:18+ changed its expected on-disk layout to a major-
    # version-specific subdirectory (pg_ctlcluster-compatible), confirmed
    # 2026-09-05 the hard way on first real bring-up: mounting directly at
    # .../data (this fleet's convention for every other Postgres, all on
    # 16) makes the 18 image refuse to start with "these Docker images
    # are configured to store database data in a format which is
    # compatible with pg_ctlcluster... there appears to be PostgreSQL
    # data in /var/lib/postgresql/data (unused mount/volume)" --
    # documented at github.com/docker-library/postgres/pull/1259. With
    # this parent-dir mount, the image manages its own
    # /var/lib/postgresql/18/docker subdirectory internally; the actual
    # files land at /srv/data/postgres-paperless/18/docker on the host,
    # one level deeper than this fleet's other Postgres instances.
    volumes:
      - /srv/data/postgres-paperless:/var/lib/postgresql
    # No networks: block -- colocated with paperless in this same compose
    # file/project, so it reaches (and is reached by) paperless over the
    # default project network without needing percolator_net at all.
    # Fully private to this file -- nothing outside it can reach this
    # database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAPERLESS_DB_USERNAME} -d ${PAPERLESS_DB_DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  # Only still needed here for paperless (the app) to reach ../valkey's
  # shared instance -- see paperless's own comment above. Created
  # idempotently by ../compose.sh before this file is ever handed to
  # `docker compose` -- see that script's own comment.
  percolator_net:
    external: true
