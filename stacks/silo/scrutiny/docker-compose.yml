services:
  scrutiny:
    # Only published on GHCR, no official Docker Hub image — third-party
    # mirrors exist there (alcapone1933/scrutiny etc.), avoid them, they're
    # not maintained by this project. omnibus = web UI + collector +
    # embedded InfluxDB in one container, sufficient for monitoring just
    # this one node — the split hub/collector/standalone-influxdb pattern
    # is only needed for monitoring multiple physical hosts from one
    # dashboard, not the case here. Pinned to a real version, not
    # `latest-omnibus` — the project's own README calls that tag
    # "dangerous," it can update the image without warning.
    image: ghcr.io/analogj/scrutiny:v0.9.3-omnibus
    container_name: scrutiny
    cap_add:
      - SYS_RAWIO   # smartctl access for SATA/SAS drives
      - SYS_ADMIN   # smartctl access for NVMe drives — drop this if silo
                    # genuinely has no NVMe (narrower capability grant),
                    # but harmless to leave if unsure.
    # No ports: mapping as of 2026-09-04 -- was "8081:8080" until then.
    # Docker's own iptables DNAT for published bridge-network ports
    # bypasses ufw entirely (confirmed on silo's Komodo port -- see the
    # runbook's 2026-09-04 entry), and this app has zero auth of its own
    # (see Known gaps), so a ufw-only "fix" would have been no fix at
    # all. Reachable now only via silo's Traefik (silo_net, container
    # DNS, internal port 8080 unchanged). InfluxDB's admin port (8086)
    # was never published either way -- the omnibus image talks to its
    # own embedded InfluxDB over localhost inside the container.
    volumes:
      - /srv/data/scrutiny/config:/opt/scrutiny/config
      - /srv/data/scrutiny/influxdb:/opt/scrutiny/influxdb
      - /run/udev:/run/udev:ro
    devices:
      # Changed 2026-09-03: was hardcoded here (`- /dev/sda`) since this
      # file isn't run through render-configs.sh's envsubst (only files
      # under config/ are) -- but docker compose has its own separate,
      # native ${VAR} interpolation straight from whatever --env-file is
      # passed to it, which compose.sh already passes (.env.local), same
      # mechanism netalertx/speedtest-tracker already rely on for
      # ${SILO_LAN_IP} etc. No envsubst/render-configs.sh step needed --
      # docker compose itself resolves this at `up` time. Real value
      # (confirmed 2026-09-02 via silo's own `lsblk -d -o
      # NAME,TYPE,SIZE,MODEL`: single physical disk, sda, 931.5G, Seagate
      # BarraCuda ST1000LM035-1RK172, a 2.5" spinning HDD not NVMe --
      # SYS_ADMIN above stays harmless-but-unused for this disk, left in
      # per its own comment in case a second/NVMe disk is added later)
      # now lives in .env.local as SCRUTINY_DISK_DEVICE, not here -- if
      # silo's disks ever change, update .env.local, not this file.
      - ${SCRUTINY_DISK_DEVICE}
    restart: unless-stopped
    # No login/auth exists in this app at all — not a documented "put it
    # behind your own auth" design choice, just genuinely absent (no
    # README section on it, no CVEs on file either — checked, not
    # assumed). Now routed through silo's Traefik/Authelia (see the
    # ports: comment above and README) -- that's the only auth this app
    # has, since it has none of its own.

networks:
  default:
    name: silo_net
    external: true
