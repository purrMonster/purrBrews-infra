services:
  jellyfin:
    # Current stable per GitHub releases, confirmed 2026-09-03 -- NOT the
    # 12.0-rc7 pre-release "next-gen" tag that also exists on DockerHub.
    image: jellyfin/jellyfin:10.11.11
    container_name: jellyfin
    ports:
      - "8096:8096"
      - "7359:7359/udp"
    devices:
      # Intel Quick Sync passthrough -- confirmed 2026-09-03 via Jellyfin's
      # own hardware-acceleration docs.
      - /dev/dri/renderD128:/dev/dri/renderD128
    group_add:
      # Confirmed gotcha: device passthrough ALONE isn't enough -- the
      # container's user must also be in the host's `render` group (name
      # varies by distro, sometimes `video`) or transcoding silently
      # falls back to software with no error. Find the real GID on
      # mochaPot with: getent group render | cut -d: -f3
      - "${MOCHAPOT_RENDER_GID}"
    volumes:
      - /srv/data/jellyfin/config:/config
      # Transcode scratch space -- local NVMe, not NFS, confirmed this
      # matters for latency.
      - /srv/data/jellyfin/cache:/cache
      # Placeholder bind mount -- cellar's NFS export isn't set up yet
      # (see stacks/cellar/README.md's smb/ section). Swap this for a
      # real NFS mount once that exists; local bind is a stopgap so
      # Jellyfin can at least be brought up and tested against whatever's
      # copied here manually in the meantime.
      - /srv/media:/media
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: ${TZ}
    restart: unless-stopped
    # No default credentials -- first-run setup wizard, confirmed via
    # Jellyfin's own docs.
