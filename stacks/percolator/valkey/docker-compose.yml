services:
  valkey:
    # Valkey, not Redis -- confirmed 2026-09-03: Redis's 2024 license
    # change moved it off OSI-approved open source, and the ecosystem has
    # shifted accordingly. Paperless-ngx's own official Postgres reference
    # compose (docker/compose/docker-compose.postgres.yml) uses
    # valkey/valkey:9-alpine as its broker -- not a guess, its own
    # maintainers already ship this exact substitution.
    image: valkey/valkey:9
    container_name: valkey
    # One shared instance for percolator's SAME-HOST apps only, as of
    # 2026-09-05 -- Immich's own dedicated valkey now lives on mochaPot,
    # colocated with immich-server itself (see the runbook's 2026-09-05
    # entry and stacks/mochaPot/immich/docker-compose.yml). Immich was
    # the one consumer that needed this published to the LAN at all,
    # since its server component lives on a different physical host --
    # with it gone, this instance never needs to leave percolator_net
    # again. No host port published anymore; nothing outside percolator
    # can reach this at all.
    #
    # Namespaced by Valkey's built-in logical DB indexes rather than one
    # container per consumer -- neither paperless-ngx's nor nextcloud's
    # docs require isolation, and it's worth conserving percolator's RAM.
    # Reserved:
    #   DB 1 -- paperless-ngx (PAPERLESS_REDIS=redis://valkey:6379/1)
    #   DB 2 -- reserved for nextcloud, once it's actually wired up
    #           (nextcloud's docs recommend but don't require redis)
    # DB 0 (Immich's former slot here) is free again.
    networks:
      - percolator_net
    # No ports: block anymore (removed 2026-09-05, see header comment
    # above) and no password configured -- matches this fleet's LAN-trust
    # posture for same-host, percolator_net-only services.
    #
    # No volume -- cache/queue only, ephemeral is correct for both
    # current consumers.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  # Created idempotently by ../compose.sh before this file is ever handed
  # to `docker compose` -- see that script's own comment for why percolator
  # needs this at all (apps in separate compose projects reaching each
  # other by hostname) and why it's not created here via a plain top-level
  # `networks: percolator_net:` block instead. external: true here means
  # this file only ever joins an already-existing network, never creates
  # or owns it.
  percolator_net:
    external: true
