services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    # network_mode: host is real official guidance, not a common-practice
    # guess -- confirmed 2026-09-03 via Home Assistant's own Cast
    # integration docs: "When running the Home Assistant Container in
    # Docker, make sure it is running with host network mode. Running
    # without it is not supported... and will cause this integration to
    # be unable to discover Cast devices." Same mDNS-multicast-doesn't-
    # cross-bridge-networks reasoning as Music Assistant on mochaPot.
    # Consequence: this container can't join a bridge network or resolve
    # container DNS names -- see postgres-homeassistant below for how its
    # own database is reached instead (127.0.0.1, loopback).
    network_mode: host
    volumes:
      - /srv/data/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      # Bluetooth integrations -- from HA's own official compose example,
      # harmless to include even if no Bluetooth adapter is used yet.
      - /run/dbus:/run/dbus:ro
    environment:
      TZ: ${TZ}
    depends_on:
      postgres-homeassistant:
        condition: service_healthy
    # Routed through percolator's own Traefik as of 2026-09-05 -- no
    # Authelia middleware here deliberately, at least for now: same
    # reasoning as nextcloud's/paperless's own copies of this comment.
    #
    # loadbalancer.server.URL, not .port -- this is the one app in this
    # file on network_mode: host, so it has no container-network IP for
    # Traefik's docker provider to auto-discover (confirmed: Traefik's
    # own docs call this out explicitly as a known limitation of host-
    # networked containers). Pointing straight at PERCOLATOR_LAN_IP:8123
    # sidesteps auto-discovery entirely -- Traefik's own container can
    # still reach it fine, host ports are reachable from any bridge
    # network on the same physical host.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homeassistant.rule=Host(`homeassistant.${DOMAIN}`)"
      - "traefik.http.routers.homeassistant.entrypoints=websecure"
      - "traefik.http.services.homeassistant.loadbalancer.server.url=http://${PERCOLATOR_LAN_IP}:8123"
    restart: unless-stopped
    # No default credentials -- onboarding wizard on first visit to
    # http://<PERCOLATOR_LAN_IP>:8123, confirmed via HA's own install docs.
    #
    # IMPORTANT -- the Postgres recorder is NOT configurable via compose at
    # all. Confirmed 2026-09-03 via HA's own Recorder integration docs:
    # there is no env var for this, it's configuration.yaml-only, and HA
    # does not create the target database itself (already created here by
    # generate-secrets.sh's homeassistant/ block + postgres-homeassistant
    # below). After first boot, add to
    # /srv/data/homeassistant/configuration.yaml:
    #
    #   recorder:
    #     db_url: postgresql://homeassistant:<HA_DB_PASSWORD from
    #       ./secrets.env.local>@127.0.0.1:5432/homeassistant
    #
    # then restart the container. Left as SQLite (HA's own default) until
    # that manual step is done -- functions fine either way, Postgres is
    # a scale/performance upgrade for the recorder specifically, not a
    # hard requirement to get HA running.
    #
    # ANOTHER manual step, needed now that Traefik sits in front of this
    # (2026-09-05): Home Assistant refuses requests from a reverse proxy
    # it doesn't explicitly trust -- confirmed via HA's own reverse-proxy
    # docs, symptom is a "Login attempt or request with invalid
    # authentication from a banned/untrusted proxy" error. Add to
    # /srv/data/homeassistant/configuration.yaml:
    #
    #   http:
    #     use_x_forwarded_for: true
    #     trusted_proxies:
    #       - ${PERCOLATOR_LAN_IP}
    #
    # then restart. Same category of gap as the recorder db_url above --
    # config lives on disk, not in compose/env, so it can't be set here.

  postgres-homeassistant:
    # Colocated here as of 2026-09-05, moved out of the old shared
    # ../postgres/docker-compose.yml (deleted) -- see the runbook's
    # 2026-09-05 entry for the full story: that file's 4-Postgres-
    # instances-in-one layout caused a real port collision between this
    # service and postgres-immich (both wanted host port 5432 -- see this
    # file's own git history for the short-lived 5433 workaround). Rather
    # than just patch that one collision, the decision was to give every
    # app on this fleet its own dedicated db layer, colocated in its own
    # app folder, so an edit made while thinking about one app's database
    # can never again silently affect an unrelated app's.
    image: postgres:16
    container_name: postgres-homeassistant
    environment:
      POSTGRES_USER: ${HA_DB_USERNAME}
      POSTGRES_PASSWORD: ${HA_DB_PASSWORD}
      POSTGRES_DB: ${HA_DB_DATABASE_NAME}
    volumes:
      - /srv/data/postgres-homeassistant:/var/lib/postgresql/data
    # No networks: block -- homeassistant itself can't join a bridge
    # network anyway (network_mode: host, see above), and now that this
    # lives in the SAME compose file/project as its only consumer, it
    # doesn't need percolator_net either. Fully private to this file --
    # nothing outside it can reach this database at all.
    #
    # Published to localhost ONLY -- Home Assistant needs network_mode:
    # host, which means it can't resolve this container by hostname the
    # way percolator_net apps do, so it reaches this via 127.0.0.1
    # instead of a container name.
    #
    # Back on plain 5432 (was briefly 127.0.0.1:5433, 2026-09-05) -- that
    # workaround only existed because postgres-immich's 0.0.0.0:5432 bind
    # shared this host. Immich's whole db layer has since moved to
    # mochaPot (see stacks/mochaPot/immich/docker-compose.yml), so nothing
    # else on percolator ever binds port 5432 anymore -- the collision
    # this dodged is now structurally impossible, not just avoided.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HA_DB_USERNAME} -d ${HA_DB_DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
