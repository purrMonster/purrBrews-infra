services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    environment:
      TZ: ${TZ}
      N8N_HOST: ${MOCHAPOT_LAN_IP}
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://${MOCHAPOT_LAN_IP}:5678/
      # Pinned explicitly rather than left to auto-generate -- confirmed
      # 2026-09-03 gotcha: if the auto-generated key in the persisted
      # volume is ever lost/regenerated, every stored credential becomes
      # unreadable. Pinning it here means a fresh container (same
      # secrets.env.local) can always decrypt the same persisted data.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
    volumes:
      - /srv/data/n8n:/home/node/.n8n
    ports:
      - "5678:5678"
    restart: unless-stopped
    # SQLite default -- confirmed, no external DB needed. No default
    # credentials -- set up an owner account on first visit.
