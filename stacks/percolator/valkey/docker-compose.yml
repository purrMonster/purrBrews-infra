services:
  valkey:
    # Valkey, not Redis -- confirmed 2026-09-03: Redis's 2024 license
    # change moved it off OSI-approved open source, and the ecosystem has
    # shifted accordingly. Immich's own current official compose already
    # uses valkey/valkey:9, and Paperless-ngx's own official Postgres
    # reference compose (docker/compose/docker-compose.postgres.yml) uses
    # valkey/valkey:9-alpine as its broker -- not a guess, both consuming
    # apps' own maintainers already ship this exact substitution. Redis-
    # protocol wire-compatible, so every REDIS_*/PAPERLESS_REDIS env var
    # below works unchanged against it.
    image: valkey/valkey:9
    container_name: valkey
    # One shared instance for percolator's apps, namespaced by Valkey's
    # built-in logical DB indexes (0-15) rather than one container per
    # consumer -- neither Immich's nor Paperless-ngx's docs explicitly
    # endorse sharing, but nothing about either app's usage (ephemeral
    # cache/queue, not persistent state) requires isolation either, and
    # percolator's RAM is worth conserving. Reserved so far:
    #   DB 0 -- immich   (REDIS_DBINDEX=0, the img's own default)
    #   DB 1 -- paperless-ngx (PAPERLESS_REDIS=redis://valkey:6379/1)
    #   DB 2 -- reserved for nextcloud, once its compose file is written
    #           (nextcloud's docs recommend but don't require redis --
    #           REDIS_HOST_PORT-style config will point it at DB 2)
    # If a future consumer needs actual isolation (ACLs, its own
    # persistence policy), split it into its own container then -- this
    # is a resource-conservation choice, not a hard architectural one.
    networks:
      - percolator_net
    # Published to the LAN (2026-09-03, corrected from the original
    # internal-only design) -- same reasoning as postgres-immich above:
    # Immich's SERVER component lives on mochaPot, a different physical
    # host, and Docker networks don't span hosts. Paperless-ngx/Nextcloud
    # stay same-host on percolator so they don't need this, but the port
    # is open to whoever reaches it now, not just them -- scope in ufw to
    # mochaPot's LAN IP specifically.
    ports:
      - "6379:6379"
    # No password configured -- matches Immich's own official compose
    # (LAN-trust, same posture as everything else in this fleet once ufw-
    # scoped -- not internal-network-only anymore now that this is
    # published, worth revisiting if that trust model ever needs
    # tightening).
    # No volume -- cache/queue only, ephemeral is correct for both current
    # consumers, matches Immich's own official compose (no volume on its
    # redis service either).
    healthcheck:
      # From Immich's own official compose, verbatim -- some images'
      # healthchecks assume a differently-named binary, don't improvise.
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  percolator_net:
    external: true
