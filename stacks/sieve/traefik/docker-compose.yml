services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    networks:
      - sieve_proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    extra_hosts:
      # Lets Traefik reach services running directly on sieve's host
      # network rather than on sieve_proxy — right now just Pi-hole's admin
      # UI (see traefik/config/dynamic.yml.template), since Pi-hole needs
      # network_mode: host for real DNS traffic and so isn't reachable by
      # container name the way authelia/lldap/redis are. host-gateway is
      # Docker's built-in resolution for "the host itself", added 2026-08-29.
      - "host.docker.internal:host-gateway"
    volumes:
      # Docker socket access is how Traefik discovers labeled containers —
      # standard for this pattern, but worth knowing it's there.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
      - /srv/data/traefik/letsencrypt:/letsencrypt
    restart: unless-stopped
    # No `traefik.enable=true` label here, deliberately (removed 2026-08-30
    # after first bring-up) — Traefik's own dashboard route already exists
    # via the file provider (dynamic.yml's `traefik-dashboard` router,
    # `service: api@internal`), same reasoning as Pi-hole not needing
    # docker-label discovery. Enabling it on this container with no
    # accompanying router rule made Traefik's docker provider auto-generate
    # a garbage self-referential router (domain "traefik-traefik", no dot)
    # and fail an ACME cert request for it on every single reload — noisy,
    # not fatal, but pointless. If this container ever needs a real
    # docker-label route of its own, add `traefik.enable=true` back
    # together with an explicit `traefik.http.routers.<name>.rule` label
    # in the same edit — never one without the other.

networks:
  sieve_proxy:
    external: true
