services:
  scrutiny:
    # Only published on GHCR, no official Docker Hub image — third-party
    # mirrors exist there (alcapone1933/scrutiny etc.), avoid them, they're
    # not maintained by this project. omnibus = web UI + collector +
    # embedded InfluxDB in one container, sufficient for monitoring just
    # this one node — the split hub/collector/standalone-influxdb pattern
    # is only needed for monitoring multiple physical hosts from one
    # dashboard, not the case here. Pinned to a real version, not
    # `latest-omnibus` — the project's own README calls that tag
    # "dangerous," it can update the image without warning.
    image: ghcr.io/analogj/scrutiny:v0.9.3-omnibus
    container_name: scrutiny
    cap_add:
      - SYS_RAWIO   # smartctl access for SATA/SAS drives
      - SYS_ADMIN   # smartctl access for NVMe drives — drop this if silo
                    # genuinely has no NVMe (narrower capability grant),
                    # but harmless to leave if unsure.
    # Port 8080 republished as of 2026-09-05 -- was removed 2026-09-04
    # (see below for why), reinstated for a real reason: this is now the
    # HUB for cellar's/percolator's/mochaPot's own scrutiny-collector
    # containers (see each of those stacks' own scrutiny-collector/
    # docker-compose.yml), which need to reach this omnibus container's
    # API over the LAN to push their SMART data -- Docker networks don't
    # span physical hosts, same reasoning as every other cross-host
    # exception in this fleet (Komodo's 9120, Authelia's 9091).
    #
    # This REOPENS the exact problem 2026-09-04 closed: this app has zero
    # auth of its own (see Known gaps below), and Docker's own iptables
    # DNAT for published bridge-network ports bypasses ufw entirely
    # (confirmed on silo's Komodo port, see the runbook's 2026-09-04
    # entry) -- so the ufw rule below is, as of this writing, NOT actually
    # restricting anything, same caveat as every other port in this
    # fleet affected by that gap. Accepted deliberately for now (2026-09-05
    # decision, see that day's runbook entry) rather than blocking the
    # multi-host Scrutiny setup on first fixing the ufw gap fleet-wide --
    # but that gap fix, whenever it happens (DOCKER-USER iptables rules,
    # not plain ufw), should scope this port to cellar's/percolator's/
    # mochaPot's specific LAN IPs for real, the way the ufw rule below
    # only pretends to today.
    #
    # Traefik/silo_net routing (container DNS, internal port 8080)
    # continues to work unchanged for browser access -- this port
    # publish is additive, for collector-to-hub traffic only, not a
    # replacement for it. InfluxDB's admin port (8086) still isn't
    # published -- the omnibus image talks to its own embedded InfluxDB
    # over localhost inside the container regardless.
    ports:
      - "8080:8080"
    volumes:
      - /srv/data/scrutiny/config:/opt/scrutiny/config
      - /srv/data/scrutiny/influxdb:/opt/scrutiny/influxdb
      - /run/udev:/run/udev:ro
    devices:
      # Changed 2026-09-03: was hardcoded here (`- /dev/sda`) since this
      # file isn't run through render-configs.sh's envsubst (only files
      # under config/ are) -- but docker compose has its own separate,
      # native ${VAR} interpolation straight from whatever --env-file is
      # passed to it, which compose.sh already passes (.env.local), same
      # mechanism netalertx/speedtest-tracker already rely on for
      # ${SILO_LAN_IP} etc. No envsubst/render-configs.sh step needed --
      # docker compose itself resolves this at `up` time. Real value
      # (confirmed 2026-09-02 via silo's own `lsblk -d -o
      # NAME,TYPE,SIZE,MODEL`: single physical disk, sda, 931.5G, Seagate
      # BarraCuda ST1000LM035-1RK172, a 2.5" spinning HDD not NVMe --
      # SYS_ADMIN above stays harmless-but-unused for this disk, left in
      # per its own comment in case a second/NVMe disk is added later)
      # now lives in .env.local as SCRUTINY_DISK_DEVICE, not here -- if
      # silo's disks ever change, update .env.local, not this file.
      - ${SCRUTINY_DISK_DEVICE}
    restart: unless-stopped
    # No login/auth exists in this app at all — not a documented "put it
    # behind your own auth" design choice, just genuinely absent (no
    # README section on it, no CVEs on file either — checked, not
    # assumed). Browser access is gated by silo's Traefik/Authelia (see
    # the port-republish comment above and README) -- that's the only
    # auth this app has for a person visiting it. The republished 8080
    # port (collector-to-hub traffic) has NO such gate at all -- anything
    # that can reach silo on 8080 can push fake SMART data or read real
    # data, same zero-auth reality as before, just now reachable from more
    # places. Acceptable on a trusted LAN today, not acceptable the day
    # this port is ever reachable from anywhere less trusted.

networks:
  default:
    name: silo_net
    external: true
