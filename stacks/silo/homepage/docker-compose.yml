services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v1.13.2
    container_name: homepage
    # No ports: mapping as of 2026-09-04 -- was "3000:3000" until then,
    # host-published directly with no Traefik/Authelia in front of it.
    # Now routed through silo's Traefik (silo_net, container DNS, internal
    # port 3000 unchanged) -- this is still a stopgap dashboard though
    # (decided 2026-08-31, "include one for now, simplest option, until we
    # build our own"), that part hasn't changed, don't extend it.
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      # Homepage 1.0+ rejects any request whose Host header isn't in this
      # list — a security guard added in the 1.0 release (confirmed via
      # Homepage's own docs before adding this, not guessed). Updated
      # 2026-09-04 for the real hostname now that this sits behind
      # Traefik -- requires a Local DNS Record for homepage.${DOMAIN} in
      # sieve's Pi-hole pointing at ${SILO_LAN_IP} (not added yet, see
      # README). Comma-separated, no spaces.
      HOMEPAGE_ALLOWED_HOSTS: homepage.${DOMAIN}
    volumes:
      - ./config:/app/config
    restart: unless-stopped

networks:
  default:
    name: silo_net
    external: true
