# SOPS encryption rules — which files get encrypted, and to whom.
#
# Recipient is the age PUBLIC key only (safe to commit). The matching
# PRIVATE key lives at /etc/purrbrews/age/keys.txt on each node that needs
# to decrypt (sieve first, others copied node-to-node over SSH per
# purrbrews-init.sh) — never in this repo, never seen by Claude. See
# secrets/README.md for the full key-handling story.
#
# Public key retrieved 2026-08-31 via, on sieve:
#   sudo age-keygen -y /etc/purrbrews/age/keys.txt
#
# Scope: silo onward only — the path_regex below matches secrets/** and
# nothing else. Per the 2026-08-31 decision, sieve's own stack deliberately
# keeps its existing, different, already-working pattern
# (stacks/sieve/generate-secrets.sh: local-only plaintext, generated on the
# node itself, never committed even as ciphertext — see the 2026-08-28
# runbook entry for why that was chosen originally). Not retrofitted onto
# SOPS — changing an already-deployed, already-working secrets mechanism
# for its own sake wasn't worth the churn or the risk to a live service.
creation_rules:
  - path_regex: secrets/.*\.sops\.yaml$
    key_groups:
      - age:
          - age15q5dhgpwcwj54rl8r9hy5v5yrmj5jqdt38jlut37h9wkgxa0ycvsx4g86g
