services:
  traefik:
    image: traefik:v3.7.12
    container_name: traefik
    # Switched 2026-09-04 from an inline `command:` block (plain HTTP
    # only) to a static traefik.yml -- needed real TLS config
    # (certificatesResolvers.dnsChallenge is deeply nested, awkward as
    # CLI flags), see traefik.yml.template's own header comment for why
    # plain HTTP turned out to be a dead end. No providers.docker here,
    # deliberately -- routes via container DNS on silo_net + the file
    # provider's router/service definitions, same reasoning as before,
    # unaffected by the TLS change.
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
      - /srv/data/traefik/letsencrypt:/letsencrypt
    networks:
      - silo_net
    restart: unless-stopped
    # Added 2026-09-04, retrofitted onto an already-live silo -- unlike
    # percolator/mochaPot (where "Traefik last, once healthy" describes
    # apps that don't exist yet), every app this fronts (Komodo, Scrutiny,
    # Homepage, Speedtest-tracker) was already up and reachable on its own
    # raw port. Originally routed via ${SILO_LAN_IP}:<published-port>
    # (see dynamic.yml.template's own history) -- changed same day, before
    # ever bringing this up for real, once Docker's own iptables DNAT for
    # those published ports turned out to bypass ufw entirely (confirmed
    # on Komodo's port, see the runbook's 2026-09-04 entry). Joins
    # silo_net (see ../compose.sh) and routes to each app by container
    # name instead -- those apps no longer publish a host port at all, so
    # this is now the ONLY path in for them, not a parallel one.
    # NetAlertX is the one exception, still reached via ${SILO_LAN_IP} --
    # network_mode: host means it can't join silo_net, same structural
    # exception as sieve's Pi-hole/percolator's Home Assistant.

networks:
  silo_net:
    external: true
