services:
  traefik:
    # v3.7.12 current stable, confirmed 2026-09-03 via DockerHub tags.
    image: traefik:v3.7.12
    container_name: traefik
    # Switched 2026-09-04 from an inline `command:` block to a static
    # traefik.yml, before this was ever brought up for real -- the
    # original "no ACME/TLS resolver, plain HTTP, this fleet's LAN is
    # already the trust boundary" decision from 2026-09-03 turned out to
    # be wrong: confirmed live on silo's identical pattern that Authelia
    # hard-requires an https/wss target URL before it'll issue a session
    # cookie at all, no config flag to relax it. See
    # traefik.yml.template's own header for the full story. DNS-01 via
    # Cloudflare needs no public reachability either, so "no public DNS"
    # was never actually the blocker it was assumed to be.
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
      - /srv/data/traefik/letsencrypt:/letsencrypt
    networks:
      - percolator_net
    restart: unless-stopped
    # No apps route through this yet -- nextcloud/paperless/homeassistant
    # need traefik.enable=true + routing labels added to their own compose
    # files once this is confirmed working, not done automatically here to
    # avoid breaking their current direct-port access before Traefik is
    # verified healthy.

networks:
  percolator_net:
    external: true
