services:
  traefik:
    image: traefik:v3.7.12
    container_name: traefik
    command:
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=false"
      # No providers.docker here, same reasoning as percolator's and
      # mochaPot's lite Traefik instances: silo's apps aren't on a shared
      # Docker network (each app runs in its own per-directory compose
      # project's isolated default network -- see diun/docker-compose.yml's
      # own comment on this), and every app already publishes its own
      # host port. Routes via the file provider straight to
      # ${SILO_LAN_IP}:<published-port>, not container DNS.
    ports:
      - "80:80"
    volumes:
      - ./config/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
    restart: unless-stopped
    # Added 2026-09-04, retrofitted onto an already-live silo -- unlike
    # percolator/mochaPot (where "Traefik last, once healthy" describes
    # apps that don't exist yet), every app this fronts (Komodo, Scrutiny,
    # NetAlertX, Homepage, Speedtest-tracker) is already up and reachable
    # on its own raw port. This ADDS a gated path in parallel; it does not
    # remove the existing ones -- see README's Traefik section for why
    # that's a real gap, not an oversight, and what closes it.
