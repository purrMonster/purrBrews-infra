services:
  pihole:
    image: pihole/pihole:2026.07.2
    container_name: pihole
    # Host networking, deliberately: Pi-hole needs to see real LAN traffic
    # for DNS (port 53) and, if you enable it later, DHCP broadcasts —
    # neither works reliably from behind the docker bridge.
    network_mode: host
    # dnsmasq needs this to fully configure itself — without it, FTL still
    # reports "listening on port 53" (binding the socket only needs
    # NET_BIND_SERVICE, which Docker grants by default) but every query
    # times out, because dnsmasq itself never finished initializing. Added
    # 2026-08-29 after `dig @127.0.0.1` timed out and the logs showed:
    # "CRIT: Error in dnsmasq configuration: process is missing required
    # capability NET_ADMIN". Standard requirement for this image, present
    # since first bring-up — just never surfaced until DNS was tested
    # directly rather than only checked via the web UI/port reachability.
    cap_add:
      - NET_ADMIN
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      DNSMASQ_LISTENING: all
      # Web UI moved off 80/443 (2026-08-29) — those ports are Traefik's
      # alone now. Traefik reverse-proxies pihole.${DOMAIN} to this port
      # instead (see traefik/config/dynamic.yml.template). DNS (port 53)
      # never went through Traefik and still doesn't — unaffected.
      FTLCONF_webserver_port: "8080o,[::]:8080o"
      # Password disabled deliberately: Authelia's forward-auth in front of
      # this route (via Traefik) is now the ONLY gate — decision 2026-08-29.
      # This is safe ONLY as long as port 8080 is unreachable except from
      # Traefik (see the ufw rule scoped to sieve_proxy's subnet in the
      # README) — that firewall rule is now the entire security boundary
      # for this admin panel, not a nice-to-have. FTLCONF_ vars force this
      # every startup (unlike the old WEBPASSWORD var, which only seeded
      # the config once) — see backlog: check whether Pi-hole itself (or a
      # fork) supports real reverse-proxy auth-trust instead of this.
      FTLCONF_webserver_api_password: ""
      # Upstream resolver Pi-hole forwards non-blocked queries to — chosen
      # 2026-08-29 (Cloudflare), set here so it survives a container
      # recreate instead of only living in whatever was clicked in
      # Settings -> DNS. FTLCONF_ vars are semicolon-separated for list
      # values; confirm after recreating that Settings -> DNS still shows
      # Cloudflare selected and the dashboard's "DNS server failure"
      # warning is gone.
      FTLCONF_dns_upstreams: "1.1.1.1;1.0.0.1"
    volumes:
      - /srv/data/pihole/etc-pihole:/etc/pihole
    # No /etc/dnsmasq.d bind mount here (removed 2026-08-30) — this image is
    # Pi-hole v6 (FTL v6.7), which generates dnsmasq's actual config
    # entirely from /etc/pihole/pihole.toml at every startup and never
    # scans /etc/dnsmasq.d for *.conf files at all. A dropped-in
    # custom-dns/*.conf file (the v5-era pattern this originally used) sits
    # there completely inert — no error, no warning, just silently never
    # read, which is why pihole.whiskertreat.fyi returned NXDOMAIN on first
    # real test despite the file being correctly rendered and mounted. The
    # real v6 mechanism is the `misc.dnsmasq_lines` array inside
    # pihole.toml (a raw dnsmasq-config-line passthrough — same
    # `address=/domain/ip` syntax we were already using, just relocated),
    # set via `pihole-FTL --config misc.dnsmasq_lines '[...]'` rather than a
    # file. See ../pihole-dns-bootstrap.sh, which sets it idempotently, and
    # the 2026-08-30 runbook entry for the full story. pihole.toml itself
    # lives in /etc/pihole (still bind-mounted above), so it persists
    # across container recreates the same way the rest of Pi-hole's state
    # does.
    restart: unless-stopped
    # DHCP is off by default here. Turn it on later via the admin UI
    # (Settings -> DHCP) only after confirming the router's own DHCP
    # server is disabled — two DHCP servers on one LAN causes real chaos.
