services:
  scrutiny-collector:
    # Collector-only image, NOT the omnibus one silo runs -- this is
    # Scrutiny's own documented "hub and spoke" pattern for monitoring
    # multiple physical hosts from one dashboard: silo's existing omnibus
    # container (web UI + API + embedded InfluxDB) is the hub, unchanged;
    # every other node with disks runs just this lightweight collector,
    # which pushes its SMART data to the hub's API instead of running its
    # own UI. Confirmed 2026-09-05 against the project's own hub/collector
    # docs. Version pinned to MATCH silo's own omnibus tag (v0.9.3) rather
    # than the docs' own generic example version -- collector and hub are
    # different images built from the same release, keeping them in sync
    # avoids a protocol/schema mismatch between what this pushes and what
    # the hub expects. Confirm ghcr.io/analogj/scrutiny:v0.9.3-collector
    # actually exists as a published tag before first pull -- if not,
    # fall back to the newest version tag that has BOTH a matching
    # -omnibus and -collector image, don't silently use two different
    # versions.
    image: ghcr.io/analogj/scrutiny:v0.9.3-collector
    container_name: scrutiny-collector
    cap_add:
      - SYS_RAWIO   # smartctl access for SATA/SAS drives
      - SYS_ADMIN   # smartctl access for NVMe drives
    environment:
      # Pushes to silo's omnibus container's API, over the LAN -- Docker
      # networks don't span physical hosts, same reasoning as every other
      # cross-host exception in this fleet. Requires silo's scrutiny
      # service to republish port 8080 (done 2026-09-05, see that
      # compose file's own comment for the real tradeoff this reopens --
      # not a free lunch, this app has zero auth of its own on either
      # end).
      COLLECTOR_API_ENDPOINT: http://${SILO_LAN_IP}:8080
    volumes:
      - /run/udev:/run/udev:ro
    devices:
      # Cellar has TWO physical disks per initiation.txt (256GB NVMe +
      # 1TB HDD) -- confirm the REAL device paths on cellar itself before
      # first bring-up, same discipline as silo's own SCRUTINY_DISK_DEVICE:
      #   lsblk -d -o NAME,TYPE,SIZE,MODEL
      # For the NVMe, use the controller node (/dev/nvme0), NOT the
      # namespace block device (/dev/nvme0n1) -- confirmed via silo's own
      # README note on this exact gotcha. Values below are placeholders
      # from .env.local, not hardcoded, so a disk swap only needs an
      # .env.local edit -- same pattern as SCRUTINY_DISK_DEVICE.
      - ${CELLAR_DISK_DEVICE_NVME}
      - ${CELLAR_DISK_DEVICE_HDD}
    restart: unless-stopped
    # No web UI, no port to publish -- this container only ever makes
    # outbound requests to silo. Nothing to route through Traefik/Authelia
    # here, unlike every other app in this fleet.
